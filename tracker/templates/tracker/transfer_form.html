
{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card soft shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Transfer</h4>
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label>From</label>
            {{ form.from_account }}
          </div>
          <div class="mb-3">
            <label>To</label>
            {{ form.to_account }}
          </div>
          <div class="mb-3">
            <label>Amount</label>
            {{ form.amount }}
          </div>
          <div class="mb-3">
            <label>Note</label>
            {{ form.description }}
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary">Transfer</button>
            <a href="{% url 'account_list' %}" class="btn btn-outline-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
