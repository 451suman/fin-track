{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">People</h3>
  <a href="{% url 'person_create' %}" class="btn btn-primary">Add Person</a>
</div>
<div class="card soft shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Name</th><th>Phone</th><th>Note</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        {% for p in object_list %}
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.phone }}</td>
            <td>{{ p.note }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-light" href="{% url 'person_update' p.pk %}">Edit</a>
              <a class="btn btn-sm btn-outline-danger" href="{% url 'person_delete' p.pk %}">Delete</a>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="4" class="text-center text-secondary py-4">No people yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
