{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card soft shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">{{ view.object|default_if_none:'Add Expense' }}</h4>
        <form method="post">
          {% csrf_token %}
          {{ form.non_field_errors }}
          <div class="row g-3">
            {% for field in form %}
              <div class="col-12">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for e in field.errors %}
                  <div class="text-danger small">{{ e }}</div>
                {% endfor %}
              </div>
            {% endfor %}
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-primary">Save</button>
            <a href="{% url 'expense_list' %}" class="btn btn-outline-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
