
{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card soft shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">{{ view.object|default_if_none:'Add Account' }}</h4>
        <form method="post">{% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex gap-2">
            <button class="btn btn-primary">Save</button>
            <a href="{% url 'account_list' %}" class="btn btn-outline-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
